name: React App PR Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened, closed] # Includes merge

jobs:
  run-on-merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build the app
        run: npm run build

      - name: Print success
        run: echo "✅ PR was merged successfully and app built!"
